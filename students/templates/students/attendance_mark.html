<!DOCTYPE html>
<html>

<head>
  <title>Mark Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🏫 School Management System</span>
  </nav>
  <div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-4">Mark Attendance</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Date</label>
        {{ form.date }}
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Present Students</label>
        <div class="border rounded p-3">
          {{ form.students }}
        </div>
        <small class="text-muted">Check the students who are present today</small>
      </div>
      <button type="submit" class="btn btn-success">Save Attendance</button>
      <a href="{% url 'attendance_view' %}" class="btn btn-secondary">View Attendance</a>
    </form>
  </div>
</body>

</html>
