<!DOCTYPE html>
<html>

<head>
  <title>Delete Teacher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🏫 School Management System</span>
  </nav>
  <div class="container mt-4" style="max-width: 500px;">
    <h2>Delete Teacher</h2>
    <p>Are you sure you want to delete <strong>{{ teacher.first_name }} {{ teacher.last_name }}</strong>?</p>
    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'teacher_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>

</html>
