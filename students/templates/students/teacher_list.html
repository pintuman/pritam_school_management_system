<!DOCTYPE html>
<html>

<head>
  <title>Teachers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark px-4">
    <a href="{% url 'dashboard' %}" class="navbar-brand fw-bold">🏫 School Management System</a>
    <div>
      <a href="{% url 'student_list' %}" class="btn btn-outline-light btn-sm me-2">Students</a>
      <a href="{% url 'teacher_list' %}" class="btn btn-outline-light btn-sm me-2">Teachers</a>
      <a href="{% url 'attendance_mark' %}" class="btn btn-outline-light btn-sm me-2">Attendance</a>
      <a href="{% url 'grade_list' %}" class="btn btn-outline-light btn-sm">Grades</a>
    </div>
  </nav>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>All Teachers</h2>
      <a href="{% url 'teacher_add' %}" class="btn btn-primary">+ Add Teacher</a>
    </div>
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Subject</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for teacher in teachers %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ teacher.first_name }} {{ teacher.last_name }}</td>
          <td>{{ teacher.email }}</td>
          <td>{{ teacher.subject }}</td>
          <td>
            <a href="{% url 'teacher_edit' teacher.pk %}" class="btn btn-sm btn-warning">Edit</a>
            <a href="{% url 'teacher_delete' teacher.pk %}" class="btn btn-sm btn-danger">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>

</html>
